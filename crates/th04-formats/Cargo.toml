[package]
name = "th04-formats"
version = "0.1.0"
edition = "2021"
license = "MIT"

# Parsers for Touhou 4 (Lotus Land Story, PC-98) data formats.
# Pure parse, zero dependencies — mirrors the th06 `formats` crate.

[dependencies]

[dev-dependencies]
# Only the examples need PNG encoding; the library stays zero-dep.
image = "0.25"

[[example]]
name = "unpack"
path = "examples/unpack.rs"

[[example]]
name = "cdg2png"
path = "examples/cdg2png.rs"

[[example]]
name = "pi2png"
path = "examples/pi2png.rs"

[[example]]
name = "std_info"
path = "examples/std_info.rs"

[[example]]
name = "enemy_disasm"
path = "examples/enemy_disasm.rs"

[[example]]
name = "sim_enemy"
path = "examples/sim_enemy.rs"
